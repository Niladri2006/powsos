services:
  - type: web
    name: pawsos
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: HOST
        value: "0.0.0.0"
      - key: ENVIRONMENT
        value: production
      - key: DB_DRIVER
        value: sqlite
      - key: DB_SOURCE
        value: /app/data/pawsos.db
      - key: STORAGE_DIR
        value: /app/data
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      - key: CORS_ALLOWED_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: pawsos-data
      mountPath: /app/data
      sizeGB: 1

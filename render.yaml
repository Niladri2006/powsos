services:
  - type: web
    name: pawsos
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: PORT
        value: "8080"
      - key: HOST
        value: "0.0.0.0"
      - key: ENVIRONMENT
        value: production
      - key: DB_DRIVER
        value: sqlite
      - key: DB_SOURCE
        value: /tmp/pawsos.db
      - key: STORAGE_DIR
        value: /tmp/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      - key: CORS_ALLOWED_ORIGIN
        value: https://powsos.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

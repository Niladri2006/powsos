<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track a Report — PawSOS</title>
  <meta name="description" content="Look up an animal report by its reference code and view status updates recorded by responders.">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation Placeholder (ui.js) -->
  <div id="navbar-mount"></div>

  <main class="container-narrow" style="padding-top: 3.5rem; padding-bottom: 5rem;">
    
    <div style="text-align: center; margin-bottom: 2.5rem;">
      <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem;">Track an Animal Rescue Report</h1>
      <p style="color: var(--text-secondary); max-width: 500px; margin: 0 auto;">
        Enter the reference code you received after submission to view status updates recorded for that report.
      </p>
    </div>

    <!-- Lookup Form Card -->
    <div class="card" style="padding: 2rem; margin-bottom: 2.5rem;">
      <form id="track-lookup-form" onsubmit="handleLookup(event)">
        <label class="form-label" for="lookup-input">
          Enter Reference Code
        </label>
        
        <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
          <input type="text" class="form-control" id="lookup-input" placeholder="e.g. PAW-…" required style="flex: 1; font-family: var(--font-mono); text-transform: uppercase;" autocomplete="off">
          <button type="submit" class="btn btn-primary">
            <span>Look Up Report</span>
          </button>
        </div>

        <div id="lookup-error-msg" style="color: var(--emergency-red); font-size: 0.88rem; margin-top: 0.6rem; display: none;"></div>
      </form>
    </div>

    <!-- Reports Saved in this Browser -->
    <div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 style="font-size: 1.25rem;">Reports Submitted from This Device</h2>
        <span style="font-size: 0.85rem; color: var(--text-muted);" id="device-reports-count">0 found</span>
      </div>

      <div id="my-reports-list" style="display: flex; flex-direction: column; gap: 1rem;">
        <!-- Rendered dynamically -->
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/store.js"></script>
  <script src="js/map-utils.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderMyReports();
    });

    async function handleLookup(e) {
      e.preventDefault();
      const input = document.getElementById('lookup-input').value.trim();
      const err = document.getElementById('lookup-error-msg');
      if (!input) return;
      const button = e.currentTarget.querySelector('button[type="submit"]');
      button.disabled = true;
      err.style.display = 'none';
      try {
        const target = await window.pawAPI.getReport(input);
        err.style.display = 'none';
        window.location.href = `case.html?id=${encodeURIComponent(target.id)}`;
      } catch (error) {
        err.style.display = 'block';
        err.textContent = error.status === 404
          ? 'No report was found for that reference code. Check the code and try again.'
          : error.message || 'The report could not be checked. Please try again when your connection is available.';
      } finally {
        button.disabled = false;
      }
    }

    async function renderMyReports() {
      const container = document.getElementById('my-reports-list');
      const countEl = document.getElementById('device-reports-count');
      if (!container || !window.pawStore) return;

      const reportIds = window.pawStore.getMyReportIds();
      countEl.textContent = `${reportIds.length} saved`;

      if (reportIds.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 2rem; color: var(--text-muted);">
            <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">📋</div>
            <p style="margin: 0; font-size: 0.92rem;">No report references are saved on this device. You can still look up a report with its reference code above.</p>
            <a href="report.html" class="btn btn-secondary btn-sm" style="margin-top: 1rem;">+ Report an Animal</a>
          </div>
        `;
        return;
      }

      const escape = window.pawEscapeHTML;
      container.innerHTML = '<p role="status">Checking saved report references…</p>';
      const results = await Promise.all(reportIds.map(async id => {
        try {
          const report = await window.pawAPI.getReport(id);
          return window.pawStore.normalizeBackendReport(report);
        } catch {
          return { id, unavailable: true };
        }
      }));
      const myReports = results.filter(report => !report.unavailable);
      if (myReports.length === 0) {
        container.innerHTML = '<p role="status">Saved references could not be checked right now. Use the reference code above when the connection is available.</p>';
        return;
      }
      container.innerHTML = myReports.map(c => `
        <div class="card card-hover" style="display: flex; justify-content: space-between; align-items: center; padding: 1.25rem; gap: 1rem; flex-wrap: wrap;">
          <div style="display: flex; align-items: center; gap: 1rem;">
            ${c.photo ? `<img src="${escape(c.photo)}" alt="" width="50" height="50" style="object-fit: cover; border-radius: var(--radius-xs);">` : '<span aria-hidden="true" style="font-size:1.5rem;">🐾</span>'}
            <div>
              <div style="display: flex; align-items: center; gap: 0.5rem;">
                <strong style="font-family: var(--font-mono); font-size: 1rem; color: var(--brand-primary);">${escape(c.id)}</strong>
                <span class="badge ${c.status === 'resolved' ? 'badge-resolved' : 'badge-urgent'}">${escape(c.status.replaceAll('_', ' '))}</span>
              </div>
              <div style="font-size: 0.88rem; color: var(--text-main); font-weight: 600;">${escape(c.animalName)}</div>
              <div style="font-size: 0.8rem; color: var(--text-muted);">${escape(c.location ? c.location.area || c.location.city || 'Approximate area' : 'Approximate area')}</div>
            </div>
          </div>

          <a href="case.html?id=${encodeURIComponent(c.id)}" class="btn btn-secondary btn-sm">
            View Live Tracker →
          </a>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
